<header class="tc-header">
  <div class="tc-header__bar">
    <a routerLink="/" class="tc-header__brand" aria-label="Terry Corner Home">
      <img src="/logo.png" alt="Terry Corner" class="tc-header__logo-img" width="46" height="46" />
      <span class="tc-header__brand-name">TERRY <span>CORNER</span></span>
    </a>

    <nav class="tc-header__nav" aria-label="Desktop Navigation">
      <a routerLink="/" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }">Home</a>
      <a routerLink="/menu" routerLinkActive="is-active">Menu</a>
      <a routerLink="/cart" routerLinkActive="is-active">Tray</a>
    </nav>

    <div class="tc-header__actions">
      <a href="tel:+251911076211" class="btn btn--outline tc-header__call-btn" aria-label="Call restaurant">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
        </svg>
        <span>0911 076 211</span>
      </a>
      <a routerLink="/menu" class="btn btn--primary tc-header__cta">EXPLORE MENU</a>
    </div>
  </div>
</header>
