<div class="tc-admin-shell">
  <header class="tc-admin-shell__bar">
    <div class="tc-admin-shell__brand">
      <img src="/logo.png" alt="Terry Corner Logo" class="tc-admin-shell__logo" width="34" height="34" />
      <span class="tc-admin-shell__title">TERRY <span>ADMIN</span></span>
    </div>

    <div class="tc-admin-shell__actions">
      <a routerLink="/menu" target="_blank" class="tc-admin-shell__link-btn">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
          <polyline points="15 3 21 3 21 9"/>
          <line x1="10" y1="14" x2="21" y2="3"/>
        </svg>
        <span>View Live Site</span>
      </a>

      <button type="button" class="tc-admin-shell__logout-btn" (click)="logout()">
        Sign Out
      </button>
    </div>
  </header>

  <nav class="tc-admin-shell__nav" aria-label="Admin sections">
    <a routerLink="/admin/products" routerLinkActive="is-active">Meals &amp; Prices</a>
    <a routerLink="/admin/categories" routerLinkActive="is-active">Categories</a>
    <a routerLink="/admin/toppings" routerLinkActive="is-active">Toppings &amp; Extras</a>
    <a routerLink="/admin/promotions" routerLinkActive="is-active">Deals</a>
    <a routerLink="/admin/settings" routerLinkActive="is-active">Database Setup</a>
  </nav>

  <main class="tc-admin-shell__main">
    <router-outlet></router-outlet>
  </main>
</div>
